            &lt;th scope=&quot;row&quot;&gt;&lt;span class=&quot;definition-name&quot;&gt;FPR&lt;/span&gt;&lt;span class=&quot;definition-alias text-small&quot;&gt;False Positive Rate&lt;br&gt;위양성률&lt;/span&gt;&lt;/th&gt;
            &lt;td&gt;&lt;span class=&quot;counts-label&quot;&gt;실제 음성 중&lt;/span&gt; 양성으로 잘못 판정한 비율입니다.&lt;br&gt;실제 정상에 얼마나 잘못 경고했는지를 봅니다.&lt;span class=&quot;definition-formula&quot;&gt;FPR = FP / (FP + TN)&lt;/span&gt;&lt;span class=&quot;definition-alias text-small&quot;&gt;FPR = 1 − 특이도&lt;/span&gt;&lt;/td&gt;

            &lt;td&gt;&lt;span class=&quot;counts-label&quot;&gt;양성으로 예측한 것 중&lt;/span&gt; 실제 양성인 비율입니다.&lt;br&gt;이상이라고 경고한 결과가 얼마나 정확한지를 봅니다.&lt;span class=&quot;definition-formula&quot;&gt;Precision = TP / (TP + FP)&lt;/span&gt;&lt;/td&gt;
            &lt;td&gt;&lt;output id=&quot;cm-definition-precision&quot; class=&quot;tabular-nums&quot;&gt;3 / (3 + 2) = 3 / 5 = 60%&lt;/output&gt;&lt;/td&gt;
          &lt;/tr&gt;
        &lt;/tbody&gt;
      &lt;/table&gt;
    &lt;/div&gt;
    &lt;div class=&quot;definition-symbols text-small&quot; aria-label=&quot;혼동행렬 기호의 뜻&quot;&gt;
      &lt;span&gt;&lt;span class=&quot;counts-label&quot;&gt;TP:&lt;/span&gt; 실제 이상을 이상으로 맞힘&lt;/span&gt;
      &lt;span&gt;&lt;span class=&quot;counts-label&quot;&gt;FP:&lt;/span&gt; 실제 정상을 이상으로 판단함 · 오탐&lt;/span&gt;
      &lt;span&gt;&lt;span class=&quot;counts-label&quot;&gt;FN:&lt;/span&gt; 실제 이상을 정상으로 판단함 · 놓침&lt;/span&gt;
      &lt;span&gt;&lt;span class=&quot;counts-label&quot;&gt;TN:&lt;/span&gt; 실제 정상을 정상으로 맞힘&lt;/span&gt;
    &lt;/div&gt;
    &lt;p class=&quot;text-small&quot;&gt;ROC의 가로축은 FPR, 세로축은 TPR입니다. 정밀도는 양성 예측을 기준으로 계산하며, 양성으로 예측한 표본이 하나도 없으면 분모가 0이 되어 정의되지 않습니다.&lt;/p&gt;

&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;classification-metrics-reference-explainer&#x27;);
  const select = id =&gt; root.querySelector(&#x27;#&#x27; + id);
  const samples = [

    {score:0.80,positive:true}, {score:0.74,positive:true},
    {score:0.63,positive:false}, {score:0.51,positive:false},
    {score:0.43,positive:true}, {score:0.32,positive:false},
    {score:0.20,positive:false}, {score:0.10,positive:false}

  const positive = samples.filter(d =&gt; d.positive);
  const negative = samples.filter(d =&gt; !d.positive);
  const ranked = [...samples].sort((a,b) =&gt; b.score-a.score);
  const rocPoints = [{fpr:0,tpr:0,threshold:Infinity}];
  let rocTP=0,rocFP=0;
  for(let i=0;i&lt;ranked.length;) {
    const threshold=ranked[i].score;

    while(i&lt;ranked.length &amp;&amp; ranked[i].score===threshold);
    rocPoints.push({fpr:rocFP/negative.length,tpr:rocTP/positive.length,threshold});
  }
  const rocArea=rocPoints.slice(1).reduce((area,p,i) =&gt; {
    const previous=rocPoints[i];
    return area+(p.fpr-previous.fpr)*(p.tpr+previous.tpr)/2;
  },0);
  const ns = &#x27;http://www.w3.org/2000/svg&#x27;;
  const make = (svg,tag,attrs,content) =&gt; {
    const e = document.createElementNS(ns,tag);
    Object.entries(attrs).forEach(([k,v]) =&gt; e.setAttribute(k,String(v)));
    if(content !== undefined) e.textContent = content;
    svg.appendChild(e); return e;
  };
  const txt = (svg,x,y,content,anchor=&#x27;start&#x27;) =&gt; make(svg,&#x27;text&#x27;,{x,y,&#x27;text-anchor&#x27;:anchor},content);
  const init = (id,height,description) =&gt; {
    const svg = select(id); const width = svg.getBoundingClientRect().width;
    svg.replaceChildren(); svg.setAttribute(&#x27;viewBox&#x27;,`0 0 ${width} ${height}`);
    svg.setAttribute(&#x27;height&#x27;,height);
    make(svg,&#x27;title&#x27;,{},description);
    return {svg,width};
  };
  const pct = n =&gt; n === null ? &#x27;—&#x27; : `${(n*100).toFixed(Number.isInteger(n*100)?0:1)}%`;
  const mark = (svg,x,y,isPositive,size=23) =&gt; {
    if(isPositive) make(svg,&#x27;circle&#x27;,{cx:x,cy:y,r:size/2,fill:&#x27;var(--viz-series-1)&#x27;,&#x27;fill-opacity&#x27;:0.20});
    else make(svg,&#x27;rect&#x27;,{x:x-size/2,y:y-size/2,width:size,height:size,rx:3,fill:&#x27;var(--viz-series-2)&#x27;,&#x27;fill-opacity&#x27;:0.20});
    txt(svg,x,y+4,isPositive?&#x27;+&#x27;:&#x27;−&#x27;,&#x27;middle&#x27;);
  };
  const getMetrics = threshold =&gt; {
    let tp=0,fp=0,fn=0,tn=0;
    samples.forEach(d =&gt; {
      if(d.score&gt;=threshold) { if(d.positive) tp++; else fp++; }

    const recall = tp/(tp+fn), specificity = tn/(tn+fp);
    return {tp,fp,fn,tn,precision,recall,specificity,f1:2*tp/(2*tp+fp+fn),bacc:(recall+specificity)/2};
  };
  function drawRanking(threshold,m) {
    const {svg,width:w} = init(&#x27;cm-ranking&#x27;,132,&#x27;같은 점수 순위에서 판정 기준만 이동&#x27;);
    const pad=3, step=(w-pad*2)/samples.length;
    const count=m.tp+m.fp, cut=pad+step*count;
    if(count) make(svg,&#x27;rect&#x27;,{x:pad,y:21,width:step*count,height:76,rx:3,fill:&#x27;var(--foreground)&#x27;,&#x27;fill-opacity&#x27;:0.035});
    samples.forEach((d,i) =&gt; {
      const x=pad+step*(i+0.5), result=d.score&gt;=threshold?(d.positive?&#x27;TP&#x27;:&#x27;FP&#x27;):(d.positive?&#x27;FN&#x27;:&#x27;TN&#x27;);
      txt(svg,x,13,`${i+1}`,&#x27;middle&#x27;);
      mark(svg,x,41,d.positive,Math.min(25,step-5));
      txt(svg,x,70,d.score.toFixed(2),&#x27;middle&#x27;);
      txt(svg,x,91,result,&#x27;middle&#x27;);
    });
    make(svg,&#x27;line&#x27;,{x1:cut,y1:20,x2:cut,y2:99,stroke:&#x27;var(--foreground)&#x27;,&#x27;stroke-width&#x27;:1.5});
    txt(svg,pad,120,`양성 예측 ${count}개`);
    txt(svg,w-pad,120,`음성 예측 ${10-count}개`,&#x27;end&#x27;);
    select(&#x27;cm-counts&#x27;).replaceChildren();
    [[&#x27;TP&#x27;,m.tp,&#x27;이상 발견&#x27;],[&#x27;FP&#x27;,m.fp,&#x27;정상을 오탐&#x27;],[&#x27;FN&#x27;,m.fn,&#x27;이상을 놓침&#x27;],[&#x27;TN&#x27;,m.tn,&#x27;정상 통과&#x27;]].forEach(([code,count,label]) =&gt; {
      const span=document.createElement(&#x27;span&#x27;);
      const strong=document.createElement(&#x27;span&#x27;);strong.className=&#x27;counts-label tabular-nums&#x27;;strong.textContent=`${code} ${count}`;
      span.append(strong,` · ${label}`);select(&#x27;cm-counts&#x27;).append(span);

  }
  function drawBars(id,rows,height,desc) {
    const {svg,width:w} = init(id,height,desc);
    const rowHeight = height/rows.length;
    rows.forEach((row,i) =&gt; {
      const y=16+i*rowHeight;
      txt(svg,0,y,row.label);
      txt(svg,w,y,pct(row.value),&#x27;end&#x27;);
      if(row.detail) txt(svg,0,y+20,row.detail);
      const by=y+(row.detail?30:11);
      make(svg,&#x27;rect&#x27;,{x:0,y:by,width:w,height:8,rx:4,fill:&#x27;var(--foreground)&#x27;,&#x27;fill-opacity&#x27;:0.07});

  }
  function drawAP() {
    let hits=0;const rows=[];

  }
  function drawROC(threshold,m) {
    const h=280;
    const {svg,width:w}=init(&#x27;cm-roc&#x27;,h,`ROC 곡선 아래 넓이 ${rocArea.toFixed(3)}. 현재 기준 ${threshold.toFixed(2)}의 FPR ${pct(m.fp/negative.length)}, TPR ${pct(m.recall)}`);
    const left=68,right=w-12,top=14,bottom=h-52,inset=7;
    const domainX=[Math.min(...rocPoints.map(p=&gt;p.fpr)),Math.max(...rocPoints.map(p=&gt;p.fpr))];
    const domainY=[Math.min(...rocPoints.map(p=&gt;p.tpr)),Math.max(...rocPoints.map(p=&gt;p.tpr))];
    const x=v=&gt;left+inset+(v-domainX[0])/(domainX[1]-domainX[0])*(right-left-2*inset);
    const y=v=&gt;bottom-inset-(v-domainY[0])/(domainY[1]-domainY[0])*(bottom-top-2*inset);
    make(svg,&#x27;rect&#x27;,{x:left,y:top,width:right-left,height:bottom-top,fill:&#x27;none&#x27;,stroke:&#x27;var(--border)&#x27;,&#x27;stroke-width&#x27;:1,&#x27;data-chart-frame&#x27;:&#x27;&#x27;});
    [0,0.25,0.5,0.75,1].forEach(t=&gt;{
      make(svg,&#x27;line&#x27;,{x1:x(0),x2:x(1),y1:y(t),y2:y(t),stroke:&#x27;var(--border)&#x27;,&#x27;stroke-width&#x27;:1});
      txt(svg,left-10,y(t)+4,`${t*100}%`,&#x27;end&#x27;);
    });
    [0,0.5,1].forEach(t=&gt;{
      make(svg,&#x27;line&#x27;,{x1:x(t),x2:x(t),y1:y(0),y2:y(1),stroke:&#x27;var(--border)&#x27;,&#x27;stroke-width&#x27;:1});
      txt(svg,x(t),bottom+18,`${t*100}%`,t===0?&#x27;start&#x27;:t===1?&#x27;end&#x27;:&#x27;middle&#x27;);
    });
    const curve=rocPoints.map((p,i)=&gt;`${i?&#x27;L&#x27;:&#x27;M&#x27;} ${x(p.fpr)} ${y(p.tpr)}`).join(&#x27; &#x27;);
    make(svg,&#x27;path&#x27;,{d:`${curve} L ${x(1)} ${y(0)} Z`,fill:&#x27;var(--viz-series-1)&#x27;,&#x27;fill-opacity&#x27;:0.16,&#x27;data-roc-area&#x27;:rocArea});
    make(svg,&#x27;line&#x27;,{x1:x(0),y1:y(0),x2:x(1),y2:y(1),stroke:&#x27;var(--muted-foreground)&#x27;,&#x27;stroke-width&#x27;:1.25,&#x27;stroke-dasharray&#x27;:&#x27;5 4&#x27;});
    make(svg,&#x27;path&#x27;,{d:curve,fill:&#x27;none&#x27;,stroke:&#x27;var(--viz-series-1)&#x27;,&#x27;stroke-width&#x27;:2.5,&#x27;stroke-linejoin&#x27;:&#x27;round&#x27;,&#x27;data-roc-curve&#x27;:&#x27;&#x27;});
    const fpr=m.fp/negative.length,tpr=m.recall,cx=x(fpr),cy=y(tpr);
    make(svg,&#x27;path&#x27;,{d:`M ${x(0)} ${cy} L ${cx} ${cy} L ${cx} ${y(0)}`,fill:&#x27;none&#x27;,stroke:&#x27;var(--foreground)&#x27;,&#x27;stroke-opacity&#x27;:0.65,&#x27;stroke-width&#x27;:1.2,&#x27;stroke-dasharray&#x27;:&#x27;2 3&#x27;,&#x27;data-roc-guides&#x27;:&#x27;&#x27;});
    make(svg,&#x27;circle&#x27;,{cx,cy,r:6,fill:&#x27;var(--viz-series-1)&#x27;,stroke:&#x27;var(--background)&#x27;,&#x27;stroke-width&#x27;:2,&#x27;data-current-roc-point&#x27;:&#x27;&#x27;,&#x27;data-fpr&#x27;:fpr,&#x27;data-tpr&#x27;:tpr});
    const areaLabel=txt(svg,x(fpr&gt;0.5&amp;&amp;fpr&lt;0.9?0.3:0.67),y(0.18),`AUC ${rocArea.toFixed(3)}`,&#x27;middle&#x27;);
    areaLabel.setAttribute(&#x27;data-optional-label&#x27;,&#x27;&#x27;);
    const xTitle=txt(svg,(left+right)/2,h-7,&#x27;위양성률 FPR&#x27;,&#x27;middle&#x27;);
    xTitle.setAttribute(&#x27;class&#x27;,&#x27;axis-title&#x27;);xTitle.setAttribute(&#x27;data-axis&#x27;,&#x27;x&#x27;);
    const yTitle=txt(svg,17,(top+bottom)/2,&#x27;재현율 TPR&#x27;,&#x27;middle&#x27;);
    yTitle.setAttribute(&#x27;class&#x27;,&#x27;axis-title&#x27;);yTitle.setAttribute(&#x27;data-axis&#x27;,&#x27;y&#x27;);

    select(&#x27;cm-auc-value&#x27;).textContent=rocArea.toFixed(3);
    select(&#x27;cm-roc-state&#x27;).textContent=`기준 ${threshold.toFixed(2)} · FPR ${pct(fpr)} · TPR ${pct(tpr)}`;
    const box=areaLabel.getBBox();
    if(box.x&lt;x(0)+4 || box.x+box.width&gt;x(1)-4) areaLabel.remove();
  }
  function drawDecision(m) {
    select(&#x27;cm-f1-value&#x27;).textContent=m.f1.toFixed(3);
    select(&#x27;cm-bacc-value&#x27;).textContent=m.bacc.toFixed(3);
    drawBars(&#x27;cm-f1&#x27;,[
      {label:&#x27;정밀도&#x27;,value:m.precision,detail:m.precision===null?&#x27;양성 예측 없음 · 정의되지 않음&#x27;:`양성 예측 ${m.tp+m.fp}개 중 정답 ${m.tp}개`},
      {label:&#x27;재현율&#x27;,value:m.recall,detail:`실제 양성 4개 중 발견 ${m.tp}개`}

    drawBars(&#x27;cm-bacc&#x27;,[
      {label:&#x27;양성 정답률 · 민감도&#x27;,value:m.recall,detail:`실제 양성 4개 중 정답 ${m.tp}개`},
      {label:&#x27;음성 정답률 · 특이도&#x27;,value:m.specificity,detail:`실제 음성 6개 중 정답 ${m.tn}개`,color:&#x27;var(--viz-series-2)&#x27;}
    ],148,&#x27;양성 정답률과 음성 정답률을 산술평균한 BAcc&#x27;);
  }
  function update(announce=false) {
    const sideBySide=root.getBoundingClientRect().width&gt;=620;
    select(&#x27;cm-ranking-grid&#x27;).classList.toggle(&#x27;viz-grid&#x27;,sideBySide);
    select(&#x27;cm-decision-grid&#x27;).classList.toggle(&#x27;viz-grid&#x27;,sideBySide);
    const threshold=Number(select(&#x27;cm-threshold&#x27;).value)/100,m=getMetrics(threshold);
    select(&#x27;cm-threshold-value&#x27;).textContent=threshold.toFixed(2);
    drawRanking(threshold,m);drawAP();drawROC(threshold,m);drawDecision(m);
    const calculation=(numerator,other,value) =&gt; {
      const relation=Number.isInteger(value*100)?&#x27;=&#x27;:&#x27;≈&#x27;;
      return `${numerator} / (${numerator} + ${other}) = ${numerator} / ${numerator+other} ${relation} ${pct(value)}`;
    };
    select(&#x27;cm-definition-threshold&#x27;).textContent=threshold.toFixed(2);
    select(&#x27;cm-definition-tpr&#x27;).textContent=calculation(m.tp,m.fn,m.recall);
    select(&#x27;cm-definition-fpr&#x27;).textContent=calculation(m.fp,m.tn,m.fp/(m.fp+m.tn));
    select(&#x27;cm-definition-precision&#x27;).textContent=m.precision===null?&#x27;정의되지 않음 · 양성 예측 없음 (TP + FP = 0)&#x27;:calculation(m.tp,m.fp,m.precision);
    if(announce)select(&#x27;cm-announcement&#x27;).textContent=`기준 ${threshold.toFixed(2)}. F1 ${m.f1.toFixed(3)}, BAcc ${m.bacc.toFixed(3)}. AP와 AUROC는 유지.`;
  }
  select(&#x27;cm-threshold&#x27;).addEventListener(&#x27;input&#x27;,()=&gt;update(true));

  update();

    }

})();
